log_level = "info"

[[inbounds]]
tag = "anytls-in"
listen = "127.0.0.1:8443"
protocol = "anytls"
# Optional plaintext HTTP cover service used after the outer TLS handshake
# when AnyTLS authentication fails. It should support h2c and HTTP/1.1.
# fallback = "127.0.0.1:8080"

[[inbounds.users]]
name = "demo"
password = "change-me"

[inbounds.tls]
certificate = "cert.pem"
private_key = "key.pem"

[[outbounds]]
tag = "direct"
protocol = "direct"

[routing]
default = "direct"
