[package]
name = "rtunnel"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"

[dependencies]
anyhow = "1.0.98"
async-trait = "0.1.88"
base64 = "0.22.1"
boring = "5.2"
boring-sys = "5.2"
brotli = "8.0"
clap = { version = "4.5.38", features = ["derive"] }
foreign-types = "0.5.0"
futures-util = "0.3.31"
hex = "0.4.3"
hyper014 = { package = "hyper", version = "0.14", features = ["http1", "http2", "server", "tcp"] }
instant-acme = { version = "0.8.5", default-features = false, features = ["hyper-rustls", "rcgen", "ring"] }
md5 = "0.7.0"
mimalloc = "0.1.52"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
sha2 = "0.10.9"
tokio = { version = "1.45.1", features = ["full"] }
tokio-boring = "5"
tokio-quiche = { version = "0.19.0", default-features = false }
tokio-stream = "0.1.17"
toml = "0.8.22"
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = ["env-filter"] }
tuic-core = { git = "https://github.com/Itsusinn/tuic", rev = "e38c357a0145a43c901947ca2facf0900f9b7da6", package = "tuic-core", default-features = false, features = ["async_marshal", "marshal", "model"] }
upstream-anytls = { package = "anytls", version = "0.3.4", default-features = false, features = ["core"] }
uuid = { version = "1.11.0", features = ["serde", "v4"] }

[dev-dependencies]
h2 = "0.3.27"
http = "0.2.12"
rcgen = "0.14.8"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
incremental = false
debug = false
debug-assertions = false
overflow-checks = false

# Fork with opt-in TLS/QUIC fingerprint controls needed for Chrome-like H3.
# BoringSSL 5.x support is provided by upstream quiche.
[patch.crates-io]
quiche = { git = "https://github.com/Glonee/quiche.git", rev = "e9a4097fe0d523ba3d4094301e66d55030dc7a69" }
tokio-quiche = { git = "https://github.com/Glonee/quiche.git", rev = "e9a4097fe0d523ba3d4094301e66d55030dc7a69" }
