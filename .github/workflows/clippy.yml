name: clippy

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - Cargo.lock
      - Cargo.toml
      - src/**
      - tests/**
      - .github/workflows/clippy.yml
  pull_request:
    paths:
      - Cargo.lock
      - Cargo.toml
      - src/**
      - tests/**
      - .github/workflows/clippy.yml

permissions:
  contents: read

jobs:
  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          components: clippy

      - name: Run cargo clippy
        run: cargo clippy --locked --all-targets -- -D warnings
